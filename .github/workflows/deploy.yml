name: Build, Push & Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 793424482103.dkr.ecr.ap-southeast-1.amazonaws.com
  EKS_CLUSTER: hiresphere-cluster
  AMPLIFY_APP_ID: d2seqo4zwfc1zs

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repositories if they don't exist
        run: |
          SERVICES=(auth-service user-service booking-service messaging-service submission-service session-service)
          for SVC in "${SERVICES[@]}"; do
            aws ecr describe-repositories --repository-names hiresphere/$SVC --region $AWS_REGION 2>/dev/null \
              || aws ecr create-repository --repository-name hiresphere/$SVC --region $AWS_REGION
          done

      - name: Build and push Docker images
        run: |
          SERVICES=(auth-service user-service booking-service messaging-service submission-service session-service)
          for SVC in "${SERVICES[@]}"; do
            echo "==> Building $SVC..."
            docker build \
              -t $ECR_REGISTRY/hiresphere/$SVC:${{ github.sha }} \
              -t $ECR_REGISTRY/hiresphere/$SVC:latest \
              ./services/$SVC
            docker push $ECR_REGISTRY/hiresphere/$SVC:${{ github.sha }}
            docker push $ECR_REGISTRY/hiresphere/$SVC:latest
            echo "    Pushed $SVC"
          done

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Apply namespace and configmap
        run: |
          kubectl apply -f infrastructure/k8s/namespace.yaml
          kubectl apply -f infrastructure/k8s/configmap.yaml

      - name: Create / update K8s secrets from GitHub Secrets
        run: |
          kubectl create secret generic hiresphere-secrets \
            --namespace hiresphere \
            --from-literal=COGNITO_USER_POOL_ID=${{ secrets.COGNITO_USER_POOL_ID }} \
            --from-literal=COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }} \
            --from-literal=BOOKING_EVENTS_QUEUE_URL=${{ secrets.BOOKING_EVENTS_QUEUE_URL }} \
            --save-config --dry-run=client -o yaml | kubectl apply -f -

      - name: Scale down all services to 1 replica before rollout
        run: |
          SERVICES=(auth-service user-service booking-service messaging-service submission-service session-service)
          for SVC in "${SERVICES[@]}"; do
            kubectl scale deployment/$SVC --replicas=1 -n hiresphere 2>/dev/null || true
          done
          sleep 20

      - name: Apply service and deployment manifests
        run: |
          SERVICES=(auth-service user-service booking-service messaging-service submission-service session-service)
          for SVC in "${SERVICES[@]}"; do
            kubectl apply -f infrastructure/k8s/$SVC.yaml
          done
          kubectl apply -f infrastructure/k8s/ingress.yaml

      - name: Rolling update with new image SHA
        run: |
          SERVICES=(auth-service user-service booking-service messaging-service submission-service session-service)
          for SVC in "${SERVICES[@]}"; do
            kubectl set image deployment/$SVC $SVC=$ECR_REGISTRY/hiresphere/$SVC:${{ github.sha }} -n hiresphere
          done

      - name: Wait for rollouts to complete
        run: |
          SERVICES=(auth-service user-service booking-service messaging-service submission-service session-service)
          for SVC in "${SERVICES[@]}"; do
            echo "==> Waiting for $SVC..."
            kubectl rollout status deployment/$SVC -n hiresphere --timeout=1000s
          done

      - name: Apply HPA after rollouts complete
        run: kubectl apply -f infrastructure/k8s/hpa.yaml

      - name: Print ingress URL
        run: kubectl get ingress -n hiresphere

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_AWS_REGION: ap-southeast-1
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          VITE_AWS_REGION: ap-southeast-1
          VITE_API_BASE_URL: https://d3695y0fpayrlg.cloudfront.net
          VITE_SESSION_SERVICE_URL: https://d3695y0fpayrlg.cloudfront.net
        run: npm ci && npm run build

      - name: Deploy frontend to Amplify
        run: |
          cd frontend/dist
          zip -r ../../frontend-dist.zip .
          cd ../..

          DEPLOYMENT=$(aws amplify create-deployment \
            --app-id $AMPLIFY_APP_ID \
            --branch-name main \
            --region $AWS_REGION \
            --output json)

          JOB_ID=$(echo $DEPLOYMENT | jq -r '.jobId')
          UPLOAD_URL=$(echo $DEPLOYMENT | jq -r '.zipUploadUrl')

          curl -s -T frontend-dist.zip "$UPLOAD_URL"

          aws amplify start-deployment \
            --app-id $AMPLIFY_APP_ID \
            --branch-name main \
            --job-id $JOB_ID \
            --region $AWS_REGION

          echo "Frontend deployed. Amplify URL: https://main.${AMPLIFY_APP_ID}.amplifyapp.com"
