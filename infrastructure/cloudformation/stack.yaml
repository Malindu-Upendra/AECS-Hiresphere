AWSTemplateFormatVersion: '2010-09-09'
Description: HireSphere - Full Infrastructure Stack

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  EKSClusterName:
    Type: String
    Default: hiresphere-cluster

Resources:

  # ─── Cognito ───────────────────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: hiresphere-user-pool
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: hiresphere-web-client
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ─── DynamoDB Tables ───────────────────────────────────────────────────────
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: hiresphere-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: hiresphere-bookings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bookingId
          AttributeType: S
      KeySchema:
        - AttributeName: bookingId
          KeyType: HASH

  SlotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: hiresphere-slots
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: hiresphere-messages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: messageId
          AttributeType: S
      KeySchema:
        - AttributeName: messageId
          KeyType: HASH

  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: hiresphere-submissions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: submissionId
          AttributeType: S
      KeySchema:
        - AttributeName: submissionId
          KeyType: HASH

  PackagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: hiresphere-packages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: packageId
          AttributeType: S
      KeySchema:
        - AttributeName: packageId
          KeyType: HASH

  PurchasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: hiresphere-purchases
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: purchaseId
          AttributeType: S
      KeySchema:
        - AttributeName: purchaseId
          KeyType: HASH

  # ─── S3 Bucket ─────────────────────────────────────────────────────────────
  SubmissionsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub hiresphere-submissions-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: MoveToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA

  # ─── SQS Queue ─────────────────────────────────────────────────────────────
  BookingEventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: hiresphere-booking-events-dlq
      MessageRetentionPeriod: 1209600

  BookingEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: hiresphere-booking-events
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BookingEventsDLQ.Arn
        maxReceiveCount: 3

  # ─── ECR Repositories ──────────────────────────────────────────────────────
  AuthServiceRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: hiresphere/auth-service

  UserServiceRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: hiresphere/user-service

  BookingServiceRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: hiresphere/booking-service

  MessagingServiceRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: hiresphere/messaging-service

  SubmissionServiceRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: hiresphere/submission-service

  SessionServiceRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: hiresphere/session-service

  # ─── VPC ───────────────────────────────────────────────────────────────────
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: hiresphere-vpc

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ─── EKS Cluster IAM ───────────────────────────────────────────────────────
  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hiresphere-eks-cluster-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EKSNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hiresphere-eks-node-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess

  # ─── EKS Cluster ───────────────────────────────────────────────────────────
  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref EKSClusterName
      RoleArn: !GetAtt EKSClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PublicSubnet1
          - !Ref PublicSubnet2
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
        EndpointPublicAccess: true
        EndpointPrivateAccess: true

  EKSNodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref EKSCluster
      NodegroupName: hiresphere-nodes
      NodeRole: !GetAtt EKSNodeRole.Arn
      ScalingConfig:
        MinSize: 2
        MaxSize: 6
        DesiredSize: 2
      InstanceTypes:
        - t3.small
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: HireSphere-UserPoolId
  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: HireSphere-UserPoolClientId
  BookingEventsQueueUrl:
    Value: !Ref BookingEventsQueue
    Export:
      Name: HireSphere-BookingEventsQueueUrl
  SubmissionsBucketName:
    Value: !Ref SubmissionsBucket
    Export:
      Name: HireSphere-SubmissionsBucket
  EKSClusterName:
    Value: !Ref EKSCluster
    Export:
      Name: HireSphere-EKSCluster
