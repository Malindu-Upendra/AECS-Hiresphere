apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-service
  namespace: hiresphere
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session-service
  template:
    metadata:
      labels:
        app: session-service
    spec:
      containers:
        - name: session-service
          image: 793424482103.dkr.ecr.ap-southeast-1.amazonaws.com/hiresphere/session-service:latest
          ports:
            - containerPort: 3006
          envFrom:
            - secretRef:
                name: hiresphere-secrets
          env:
            - name: PORT
              value: "3006"
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: hiresphere-config
                  key: AWS_REGION
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: session-service
  namespace: hiresphere
spec:
  selector:
    app: session-service
  ports:
    - port: 80
      targetPort: 3006
