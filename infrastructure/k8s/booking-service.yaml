apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: hiresphere
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: 793424482103.dkr.ecr.ap-southeast-1.amazonaws.com/hiresphere/booking-service:latest
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: hiresphere-config
            - secretRef:
                name: hiresphere-secrets
          env:
            - name: PORT
              value: "3003"
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: hiresphere
spec:
  selector:
    app: booking-service
  ports:
    - port: 80
      targetPort: 3003
