apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: hiresphere
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 793424482103.dkr.ecr.ap-southeast-1.amazonaws.com/hiresphere/auth-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: hiresphere-config
                  key: AWS_REGION
            - name: COGNITO_USER_POOL_ID
              valueFrom:
                secretKeyRef:
                  name: hiresphere-secrets
                  key: COGNITO_USER_POOL_ID
            - name: COGNITO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hiresphere-secrets
                  key: COGNITO_CLIENT_ID
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: hiresphere
spec:
  selector:
    app: auth-service
  ports:
    - port: 80
      targetPort: 3001
